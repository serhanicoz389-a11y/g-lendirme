<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dilek Ofis - Fiyat Listesi</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff; padding: 22px 16px 18px; text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
    header p { margin: 4px 0 0; opacity: .9; }
    .toolbar {
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
    }
    .toolbar input { font-size: 16px; padding: 11px 14px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
    .chip {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 6px 14px; white-space: nowrap; cursor: pointer; font-size: 14px;
    }
    .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    main { max-width: 760px; margin: 0 auto; padding: 8px 16px 40px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--brand-dark); margin: 22px 4px 8px; }
    .list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
    .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; }
    .item + .item { border-top: 1px solid var(--line); }
    .item .name { font-weight: 500; }
    .item .unit { font-size: 13px; color: var(--muted); }
    .item .price { font-weight: 700; font-size: 17px; color: var(--brand-dark); }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .search-row { display: flex; gap: 8px; }
    .scan-btn {
      flex: none; border: 0; border-radius: 8px; background: var(--brand); color: #fff;
      padding: 0 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .scan-btn svg { width: 22px; height: 22px; }
    .modal { position: fixed; inset: 0; z-index: 20; background: rgba(15, 17, 23, .75); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 16px 24px; max-height: 92vh; overflow-y: auto; }
    @media (min-width: 560px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-head h3 { margin: 0; }
    .close { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 220px; }
    #reader video { width: 100% !important; }
    .scan-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 10px 0; }
    .photo-btn { display: block; text-align: center; width: 100%; padding: 12px; border: 1px dashed var(--brand); border-radius: 10px; color: var(--brand); font-weight: 600; cursor: pointer; }
    .result { text-align: center; padding: 10px 0 4px; }
    .result .r-cat { color: var(--muted); font-size: 14px; }
    .result .r-name { font-size: 22px; font-weight: 700; margin: 4px 0; }
    .result .r-price { font-size: 40px; font-weight: 800; color: var(--brand-dark); margin: 6px 0; }
    .result .r-code { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
    .result.notfound .r-name { color: var(--danger); font-size: 18px; }
    .result .again { margin-top: 16px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 16px 30px; }
    footer a { color: var(--brand); }
  </style>
</head>
<body>
  <header>
    <h1 id="shop-name">Dilek Ofis</h1>
    <p id="slogan">Kırtasiye &amp; Ofis Malzemeleri</p>
  </header>

  <div class="toolbar">
    <div class="search-row">
      <input id="search" type="search" placeholder="Ürün ara… (örn. defter, kalem)" autocomplete="off">
      <button class="scan-btn" id="scan-open" aria-label="Barkod veya karekod okut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
        Okut
      </button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="catalog"><p class="empty">Yükleniyor…</p></main>

  <div class="modal hidden" id="scan-modal">
    <div class="sheet">
      <div class="sheet-head"><h3 id="scan-title">Barkod / karekod okut</h3><button class="close" id="scan-close" aria-label="Kapat">✕</button></div>
      <div id="scan-area">
        <div id="reader"></div>
        <p class="scan-hint" id="scan-hint">Kamerayı ürünün barkoduna veya karekoduna tutun.</p>
        <label class="photo-btn">📷 Fotoğraf çekerek okut
          <input type="file" id="scan-photo" accept="image/*" capture="environment" hidden></label>
      </div>
      <div id="scan-result" class="hidden"></div>
    </div>
  </div>

  <footer>
    <div id="contact"></div>
    <div id="updated"></div>
  </footer>

  <script>
    const fmt = new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' });
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = (s) => s.toLocaleLowerCase('tr-TR');
    let products = [];
    let categories = [];
    let activeCategory = '';

    function render() {
      const q = norm(document.getElementById('search').value.trim());
      const filtered = products.filter((p) =>
        (!activeCategory || p.category === activeCategory) &&
        (!q || norm(p.name).includes(q) || norm(p.category).includes(q) || (p.barcode && p.barcode.includes(q))));

      const groups = {};
      for (const p of filtered) (groups[p.category] ||= []).push(p);
      const order = (c) => (categories.includes(c) ? categories.indexOf(c) : 999);

      const el = document.getElementById('catalog');
      if (!filtered.length) { el.innerHTML = '<p class="empty">Aradığınız ürün bulunamadı.</p>'; return; }
      el.innerHTML = Object.keys(groups).sort((a, b) => order(a) - order(b) || a.localeCompare(b)).map((cat) => `
        <h2>${esc(cat)}</h2>
        <div class="list">
          ${groups[cat].sort((a, b) => (a.name < b.name ? -1 : 1)).map((p) => `
            <div class="item">
              <div><div class="name">${esc(p.name)}</div><div class="unit">${esc(p.unit)}</div></div>
              <div class="price money">${fmt.format(p.price)}</div>
            </div>`).join('')}
        </div>`).join('');
    }

    function renderChips() {
      const cats = categories.filter((c) => products.some((p) => p.category === c));
      const chips = document.getElementById('chips');
      chips.innerHTML = ['', ...cats].map((c) =>
        `<button class="chip${c === activeCategory ? ' active' : ''}" data-cat="${esc(c)}">${c ? esc(c) : 'Tümü'}</button>`).join('');
    }

    document.getElementById('chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      renderChips();
      render();
    });
    document.getElementById('search').addEventListener('input', render);

    // Dükkân bilgisayarında canlı veri /api/catalog'dan gelir; internetteki sitede (Cloudflare Pages)
    // sunucu olmadığı için yayınlanmış catalog.json dosyası okunur.
    async function loadCatalog() {
      if (window.__CATALOG__) return window.__CATALOG__; // tek dosyalık sürüm
      try {
        const r = await fetch('/api/catalog');
        if (r.ok && r.headers.get('content-type')?.includes('json')) return await r.json();
      } catch {}
      const r = await fetch('../catalog.json?t=' + Date.now());
      if (!r.ok) throw new Error('Katalog bulunamadı');
      return r.json();
    }

    loadCatalog().then(({ settings, categories: cats, products: list }) => {
      products = list;
      categories = cats || [];
      document.title = settings.shopName + ' - Fiyat Listesi';
      document.getElementById('shop-name').textContent = settings.shopName;
      document.getElementById('slogan').textContent = settings.slogan;
      const contact = [settings.address, settings.phone && `<a href="tel:${esc(settings.phone)}">${esc(settings.phone)}</a>`]
        .filter(Boolean).map((x) => x.startsWith('<a') ? x : esc(x)).join(' · ');
      document.getElementById('contact').innerHTML = contact;
      const last = list.reduce((m, p) => (p.updatedAt > m ? p.updatedAt : m), '');
      if (last) document.getElementById('updated').textContent =
        'Fiyatlar son güncelleme: ' + new Date(last).toLocaleDateString('tr-TR') + ' · Fiyatlara KDV dahildir.';
      renderChips();
      render();
      openFromLink();
    }).catch(() => {
      document.getElementById('catalog').innerHTML = '<p class="empty">Fiyat listesi yüklenemedi. Lütfen tekrar deneyin.</p>';
    });

    // ---------- Kamerayla barkod okutma ----------
    // Kamera açıkken düz (EAN, UPC, Code128…) ve kare (QR, DataMatrix…) kodları kendiliğinden algılar;
    // her yeni kodda sonuç kameranın altında güncellenir, düğmeye basmak gerekmez.
    // Canlı kamera yalnızca HTTPS (veya localhost) üzerinde açılabilir; yerel ağda (http://192.168…)
    // tarayıcılar kamerayı engeller. O durumda "fotoğraf çekerek okut" yöntemi kullanılır.
    let scanner = null;
    let libLoading = null;
    let lastCode = '', lastTime = 0;
    const $s = (id) => document.getElementById(id);

    function loadScannerLib() {
      if (window.Html5Qrcode) return Promise.resolve();
      libLoading ||= new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = '/vendor/html5-qrcode.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Okuyucu yüklenemedi'));
        document.head.appendChild(s);
      });
      return libLoading;
    }

    function createScanner() {
      const F = Html5QrcodeSupportedFormats;
      return new Html5Qrcode('reader', {
        verbose: false,
        formatsToSupport: [
          // Düz barkodlar
          F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.CODABAR, F.ITF,
          // Kare (2 boyutlu) kodlar
          F.QR_CODE, F.DATA_MATRIX, F.AZTEC, F.PDF_417,
        ],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      });
    }

    const canLiveScan = () => window.isSecureContext && navigator.mediaDevices?.getUserMedia;

    async function stopScanner() {
      if (scanner?.isScanning) { try { await scanner.stop(); } catch {} }
    }

    // Okunan metinden ürünü bul: doğrudan barkod ya da ürün QR etiketindeki bağlantı (?b=… / ?u=…)
    function findProduct(text) {
      const code = text.trim();
      try {
        const url = new URL(code);
        const b = url.searchParams.get('b'), u = url.searchParams.get('u');
        if (b) return { code: b, product: products.find((x) => x.barcode === b) };
        if (u) return { code: '', product: products.find((x) => x.id === u) };
      } catch {}
      return { code, product: products.find((x) => x.barcode && x.barcode === code) };
    }

    function showResult({ code, product: p }, live) {
      const box = $s('scan-result');
      box.classList.remove('hidden');
      const again = live ? '' : '<button class="btn primary again" data-again>Başka ürün okut</button>';
      if (p) {
        $s('scan-title').textContent = 'Ürün bulundu';
        box.innerHTML = `<div class="result">
          <div class="r-cat">${esc(p.category)}</div>
          <div class="r-name">${esc(p.name)}</div>
          <div class="r-price money">${fmt.format(p.price)}</div>
          <div class="muted">${esc(p.unit)} fiyatı</div>
          ${code ? `<div class="r-code">${esc(code)}</div>` : ''}${again}</div>`;
      } else {
        $s('scan-title').textContent = 'Ürün bulunamadı';
        box.innerHTML = `<div class="result notfound">
          <div class="r-name">Bu kod listemizde kayıtlı değil.</div>
          <p class="muted">Fiyat bilgisi için lütfen kasaya sorun.</p>
          <div class="r-code">${esc(code)}</div>${again}</div>`;
      }
    }

    function onLiveScanned(text) {
      // Kamera aynı kodu saniyede birçok kez görür; aynı kodu 2 saniye içinde tekrar gösterme.
      const now = Date.now();
      if (text === lastCode && now - lastTime < 2000) return;
      lastCode = text; lastTime = now;
      if (navigator.vibrate) navigator.vibrate(60);
      showResult(findProduct(text), true);
      $s('scan-hint').textContent = 'Başka bir ürün okutmak için kamerayı o ürünün koduna tutun.';
    }

    async function startLive() {
      $s('reader').classList.toggle('hidden', !canLiveScan());
      if (!canLiveScan()) {
        $s('scan-hint').textContent = 'Aşağıdaki düğmeye basıp ürünün barkodunun veya karekodunun fotoğrafını çekin.';
        return;
      }
      $s('scan-hint').textContent = 'Kamerayı ürünün barkoduna veya karekoduna tutun, kendiliğinden okunur.';
      try {
        await scanner.start({ facingMode: 'environment' }, {
          fps: 12,
          // Hem düz hem kare kodlar sığsın diye geniş, kareye yakın bir okuma alanı
          qrbox: (w, h) => { const side = Math.min(w, h); return { width: Math.round(Math.min(w * 0.9, side * 1.2)), height: Math.round(side * 0.7) }; },
          videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        }, onLiveScanned, () => {});
      } catch {
        $s('reader').classList.add('hidden');
        $s('scan-hint').textContent = 'Kamera açılamadı. Fotoğraf çekerek okutabilirsiniz.';
      }
    }

    async function openScanner() {
      lastCode = '';
      $s('scan-modal').classList.remove('hidden');
      $s('scan-area').classList.remove('hidden');
      $s('scan-result').classList.add('hidden');
      $s('scan-title').textContent = 'Barkod / karekod okut';
      try {
        await loadScannerLib();
        scanner ||= createScanner();
        await startLive();
      } catch {
        $s('scan-hint').textContent = 'Okuyucu yüklenemedi. Sayfayı yenileyip tekrar deneyin.';
      }
    }

    async function closeScanner() {
      await stopScanner();
      $s('scan-modal').classList.add('hidden');
      if (location.search) history.replaceState(null, '', location.pathname);
    }

    $s('scan-open').addEventListener('click', openScanner);
    $s('scan-close').addEventListener('click', closeScanner);
    $s('scan-modal').addEventListener('click', (e) => { if (e.target.id === 'scan-modal') closeScanner(); });
    $s('scan-result').addEventListener('click', (e) => { if (e.target.closest('[data-again]')) openScanner(); });

    $s('scan-photo').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      await stopScanner();
      $s('scan-hint').textContent = 'Okunuyor…';
      try {
        await loadScannerLib();
        scanner ||= createScanner();
        const text = await scanner.scanFile(file, false);
        $s('scan-area').classList.add('hidden');
        showResult(findProduct(text), false);
      } catch {
        $s('scan-hint').textContent = 'Kod okunamadı. Koda daha yakından, net ve ışıklı bir fotoğraf çekin.';
      }
    });

    // Ürün QR etiketi telefonun kendi kamerasıyla okutulunca sayfa ?b=… veya ?u=… ile açılır:
    // ürünü doğrudan göster.
    function openFromLink() {
      if (!/[?&](b|u)=/.test(location.search)) return;
      $s('scan-modal').classList.remove('hidden');
      $s('scan-area').classList.add('hidden');
      showResult(findProduct(location.href), false);
    }
  </script>
<script>setTimeout(function(){parent.postMessage("ok","*")},1500)</script></body>
</html>
